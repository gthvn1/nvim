# https://alacritty.org/config-alacritty.html

[general]
import = [
    "~/.config/alacritty/alacritty-theme/themes/citylights.toml"
]

[window]
#decorations = "None"
#padding = {x = 10, y = 10}
opacity = 0.97

[font]
size = 11.0

[font.normal]
family = "CodeNewRomanNerdFont"
style = "Regular"

[font.bold]
family = "CodeNewRomanNerdFont"
style = "Bold"

[font.italic]
family = "CodeNewRomanNerdFont"
style = "Italic"

[font.bold_italic]
family = "CodeNewRomanNerdFont"
style = "Italic"


#[terminal.shell]
#program = "/usr/bin/fish"
#args = ["-c", "zellij -l welcome"]
